saveExact: true
engineStrict: true
minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true
trustPolicy: "off"
trustPolicyExcludePrune: true
auditConfig:
  # Unpatched static-build dependencies; scope and removal condition are in README.
  ignoreGhsas:
    - GHSA-gcqx-w48m-w2h4
    - GHSA-fc5q-39xc-vjpf
allowBuilds:
  esbuild: true
  sharp: true
overrides:
  # Ajv requires 3.x; an open-ended range can select an incompatible major.
  fast-uri: "^3.1.9"
  # Astro 7.4.5+'s bundler accepts the 2.0 betas, which @astrojs/check then loads and crashes on; every consumer takes 1.x.
  "@emnapi/core": "^1.11.3"
  "@emnapi/runtime": "^1.11.3"
