saveExact: true
engineStrict: true
minimumReleaseAge: 0
minimumReleaseAgeExcludePrune: true
trustPolicy: "off"
trustPolicyExcludePrune: true
allowBuilds:
  esbuild: true
  sharp: true
overrides:
  # Ajv requires 3.x; an open-ended range can select an incompatible major.
  fast-uri: "^3.1.9"
  # Tailwind 3 and postcss-nested 6 otherwise retain the vulnerable 6.x parser.
  postcss-selector-parser@<7.1.6: "^7.1.7"
auditConfig:
  ignoreGhsas:
    # deepmerge has no patched release, and vite-plugin-svelte only merges this
    # site's own build config with it, so no untrusted input reaches it.
    - GHSA-gcqx-w48m-w2h4
