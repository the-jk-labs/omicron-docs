# Dependency updates.
#
# Security advisories were being raised against this repository with nothing
# opening a fix for them, so an alert sat open indefinitely — and an advisory
# nobody acts on is indistinguishable from one nobody noticed. Dependabot now
# raises the pull request itself.
#
# It runs on GitHub's infrastructure, which matters here: regenerating
# pnpm-lock.yaml needs registry access that a contributor's sandbox may not
# have, and the lockfile must be produced by the same pnpm the CI pins
# (packageManager in package.json) or `pnpm install --frozen-lockfile` rejects
# it. Dependabot handles both.
#
# Security fixes are separate from this file and arrive whether or not a
# schedule is configured; the weekly run below is for ordinary version drift,
# grouped so an upgrade is one review rather than a dozen.
version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore(deps)
    # Majors are excluded from every group and from this repository's updates
    # entirely. A grouped major is the worst of both worlds: it arrives looking
    # like routine hygiene, and the first run bundled Tailwind 3 -> 4 with two
    # patch bumps. This project is pinned to Tailwind 3.4 on purpose — the Bits
    # UI class strings in the docs and the app are written against v3 syntax, so
    # a v4 upgrade is a design-system migration, not a dependency update.
    #
    # Major upgrades are still worth doing; they are just a decision somebody
    # makes deliberately, not something merged on a Monday because CI was green.
    ignore:
      - dependency-name: "*"
        update-types:
          - version-update:semver-major
    groups:
      astro:
        patterns:
          - "astro"
          - "@astrojs/*"
        update-types:
          - minor
          - patch
      dev-tooling:
        dependency-type: development
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: chore(ci)
