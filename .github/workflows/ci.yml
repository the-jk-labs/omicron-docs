name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Astro 7 requires >=22.12; .nvmrc keeps CI, Vercel, and local in step.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Type-checks .astro/.svelte and validates every page's frontmatter
      # against the content collection schema.
      - run: npm run check

      # Also generates the Pagefind index, so a broken search build fails here
      # rather than in production.
      - run: npm run build
